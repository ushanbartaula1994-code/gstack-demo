version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-fitness-coach-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aifitnesscoach
      POSTGRES_USER: aifitness
      POSTGRES_PASSWORD: aifitness2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aifitness -d aifitnesscoach"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for caching (optional, can be added later)
  # redis:
  #   image: redis:7-alpine
  #   container_name: ai-fitness-coach-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data

volumes:
  postgres_data:
  # redis_data:
