[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-fitness-coach-backend"
version = "0.1.0"
description = "Backend API for AI Fitness Coach"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "AI Fitness Coach Team"}
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.2",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "stripe>=8.5.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "aioresponses>=0.7.7",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "black>=24.8.0",
    "isort>=5.13.2",
    "flake8>=7.1.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
